<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古诗词 · 拾趣小游戏</title>
    <link rel="icon" type="image/png" sizes="64x64" href="../../assets/portal/favicon-64.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="app-container">
        <!-- 头部导航 -->
        <header class="header">
            <div class="header-content">
                <a class="back-btn" href="../../index.html">← 返回大厅</a>
                <h1 class="app-title">古诗词学习助手</h1>
                <div class="user-info">
                    <span class="user-name" id="userName">游客</span>
                </div>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 欢迎页面 -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-content">
                    <h2>欢迎来到古诗词学习世界</h2>
                    <p>通过游戏化方式学习和记忆经典古诗词</p>
                    
                    <!-- 难度选择 -->
                    <div class="difficulty-selection">
                        <h3>选择难度</h3>
                        <div class="difficulty-buttons">
                            <button class="difficulty-btn" data-level="beginner">
                                <div class="btn-icon">📝</div>
                                <div class="btn-text">
                                    <h4>初级 · 五言短诗</h4>
                                    <p>10 关，4 个选项，诗句短、上手快</p>
                                </div>
                            </button>
                            <button class="difficulty-btn" data-level="intermediate">
                                <div class="btn-icon">📜</div>
                                <div class="btn-text">
                                    <h4>中级 · 七言绝句</h4>
                                    <p>10 关，5 个选项，干扰项更像</p>
                                </div>
                            </button>
                            <button class="difficulty-btn" data-level="advanced">
                                <div class="btn-icon">🏮</div>
                                <div class="btn-text">
                                    <h4>高级 · 律诗与词</h4>
                                    <p>10 关，6 个选项，长诗长调且不给字数线索</p>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 游戏界面 -->
            <div class="game-screen" id="gameScreen" style="display: none;">
                <!-- 游戏头部信息 -->
                <div class="game-header">
                    <button class="back-btn" id="backBtn">← 返回</button>
                    <div class="game-info">
                        <span class="current-level" id="currentLevel">初级</span>
                        <span class="score" id="score">得分: 0</span>
                    </div>
                </div>

                <!-- 初级难度游戏区域 -->
                <div class="beginner-game" id="beginnerGame">
                    <div class="poem-display">
                        <div class="poem-info">
                            <h3 class="poem-title" id="poemTitle">静夜思</h3>
                            <p class="poem-author" id="poemAuthor">李白</p>
                        </div>
                        
                        <div class="poem-content" id="poemContent">
                            <!-- 诗句将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <div class="options-container" id="optionsContainer">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </div>

                    <div class="game-controls">
                        <button class="submit-btn" id="submitBtn" disabled>提交答案</button>
                        <button class="next-btn" id="nextBtn" style="display: none;">下一题</button>
                    </div>
                </div>

                <!-- 结果反馈 -->
                <div class="result-feedback" id="resultFeedback" style="display: none;">
                    <div class="feedback-content">
                        <div class="feedback-icon" id="feedbackIcon">✅</div>
                        <div class="feedback-text" id="feedbackText">回答正确！</div>
                        <div class="character-animation" id="characterAnimation">
                            <div class="character">🎭</div>
                            <div class="thanks-text">谢谢你的帮助！</div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <!-- 加载脚本 -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
